<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
.box{
    display: grid;
    grid-template-columns: 1fr 1fr;
}
.box1{
    background-color: aquamarine;
    width: auto;
    height: 400px;
}
.box2{
    background-color: aqua;
    width: auto;
    height: 400px;
    background: url("images/aiueo.jpg");
    background-repeat: no-repeat;
}
.box3{
    background-color: aliceblue;
    color: brown;
    width: 1fr;
    height: 300px;
}
</style>
<body>
<div class="box">
    <div class="box1"></div>
    <div class="box2"></div>
</div>
    <div class="box3">
        <h2>ニュース</h2>
        <ul></ul>
    </div>
<script src="1.js"></script>
</body>
</html>
